      description: Lookup for any league using its unique ID.
      operationId: lookupLeagueById
      tags:
        - V2 API Lookup
      parameters:
        - in: path
          name: idLeague
          description: The ID of the league to lookup.
          schema:
            type: integer
          required: true
          example: 4328
      responses:
        '200':
          description: League details for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLookupResponse'
              example:
                lookup:
                - idLeague: '4328'
                  idSoccerXML: 
                  idAPIfootball: '7293'
                  strSport: Soccer
                  strLeague: English Premier League
                  strLeagueAlternate: Premier League, EPL
