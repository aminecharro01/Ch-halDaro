  /list/seasons/{idLeague}:
    get:
      summary: List Seasons by League ID
      description: List all seasons available for a league using its unique ID.
      operationId: listSeasonsByLeagueId
      tags:
        - V2 API List
      parameters:
        - in: path
          name: idLeague
          description: The ID of the league to list seasons for.
          schema:
            type: integer
          required: true
          example: 4328
      responses:
        '200':
          description: List of seasons for the specified league
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonList'
              example:
                list:
                - strSeason: 1992-1993
                - strSeason: 1993-1994
                - strSeason: 1994-1995
              
