openapi: 3.0.3
info:
  title: TheSportsDB V2 API
  version: 2.0.0
  contact:
    name: TheSportsDB
    url: https://www.thesportsdb.com
  description: |
    TheSportsDB is a free and open database for sports data, providing information about leagues, teams, players, events, and venues across various sports. This API allows developers to access and integrate sports data into their applications.

    ## Authentication
    To access the API, you need an API key. You can obtain one by registering on [TheSportsDB](https://www.thesportsdb.com).

    ## Rate Limiting
    The API has a rate limit of 1000 requests per day for free users. Please refer to the documentation for more details on rate limits.

    ## Versioning
    This is version 2 of TheSportsDB API.

servers:
  - url: https://www.thesportsdb.com/api/v2/json
    description: TheSportsDB API v2

security:
  - apiKeyAuth: []

tags:
  - name:  V2 API Search
    description: |
      Search for any sports league, team, player, event, or venue using a text string.
      This endpoint allows you to find specific entities based on their names.
  - name:  V2 API Lookup
    description: |
      Lookup for any sports league, team, player, event, or venue using their unique IDs.
      This endpoint provides detailed information about specific entities based on their IDs.
  - name:  V2 API List
    description: |
      List all teams, seasons, players, or venues for a specific league or team.
      This endpoint allows you to retrieve collections of entities related to a specific league or team.
  - name:  V2 API Filter
    description: |
      Filter events by date, country, sport, or channel.
      This endpoint allows you to narrow down events based on specific criteria such as date or country.
  - name:  V2 API All
    description: |
      Retrieve all supported countries, sports, or leagues.
      This endpoint provides a comprehensive list of all entities available in the API.
  - name:  V2 API Schedule
    description: |
      Schedule endpoints to retrieve upcoming or previous events for leagues, teams, or venues.
      This endpoint allows you to get scheduled events based on specific criteria such as league or team.
  - name:  V2 API Livescores
    description: |
      Livescores endpoints to retrieve live scores for specific sports or leagues.
      This endpoint provides real-time scores for ongoing matches or events.

  
paths:

# V2 API Search Endpoints
  /search/league/{leagueName}:
    get:
      summary: Search sports league
      description: Search for any sports league using a text string.
      operationId: searchLeagueByName
      tags:
        - V2 API Search
      parameters:
        - in: path
          name: leagueName
          description: The name of the league to search for.
          schema:
            type: string
          required: true
          example: english_premier_league
      responses:
        '200':
          description: Array of leagues matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueSearchResponse'
              example:
                search:
                - idLeague: '4328'
                  strLeague: English Premier League
                  strSport: Soccer
                  strBadge: https://www.thesportsdb.com/images/media/league/badge/gasy9d1737743125.png
                  strCountry: England
                  strCurrentSeason: 2025-2026
                  strGender: Male
  /search/team/{teamName}:
    get:
      summary: Search sports team
      description: Search for any sports team using a text string.
      operationId: searchTeamByName
      tags:
        - V2 API Search
      parameters:
        - in: path
          name: teamName
          description: The name of the team to search for.
          schema:
            type: string
          required: true
          example: manchester_united
      responses:
        '200':
          description: Array of teams matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSearchResponse'
              example:
                search:
                - idTeam: '133612'
                  strTeam: Manchester United
                  idLeague: '4328'
                  strLeague: English Premier League
                  strBadge: https://r2.thesportsdb.com/images/media/team/badge/xzqdr11517660252.png
                  strCountry: England
                  strGender: Male
                  strLocation: Trafford, Greater Manchester
                  strSport: Soccer
                - idTeam: '140199'
                  strTeam: Manchester United U21
                  idLeague: '4834'
                  strLeague: _No League Soccer
                  strBadge: https://r2.thesportsdb.com/images/media/team/badge/z5f11t1623621868.png
                  strCountry: England
                  strGender: Male
                  strLocation: ''
                  strSport: Soccer
                - idTeam: '140226'
                  strTeam: Manchester United WFC
                  idLeague: '4849'
                  strLeague: English Womens Super League
                  strBadge: https://r2.thesportsdb.com/images/media/team/badge/xqy8ct1605361724.png
                  strCountry: England
                  strGender: Female
                  strLocation: Sale Way, Leigh, Greater Manchester, UK
                  strSport: Soccer
                - idTeam: '147970'
                  strTeam: Manchester United Youth
                  idLeague: '5417'
                  strLeague: UEFA Youth League
                  strBadge: https://r2.thesportsdb.com/images/media/team/badge/lexfz71705234042.png
                  strCountry: England
                  strGender: Male
                  strLocation: Leigh, England
                  strSport: Soccer
  /search/player/{playerName}:
    get:
      summary: Search sports player
      description: Search for any sports person using a text string.
      operationId: searchPlayerByName
      tags:
        - V2 API Search
      parameters:
        - in: path
          name: playerName
          description: The name of the player to search for.
          schema:
            type: string
          required: true
          example: harry_kane
      responses:
        '200':
          description: Player details matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSearchResponse'
              example:
                search:
                - idPlayer: '34146220'
                  strPlayer: Harry Kane
                  idTeam: '133664'
                  strTeam: Bayern Munich
                  dateBorn: '1993-07-28'
                  strThumb: https://www.thesportsdb.com/images/media/player/thumb/xk0gd71699458766.jpg
                  strSport: Soccer
  /search/event/{eventName}:
    get:
      summary: Search sports event
      description: Search for any sports event using a text string.
      operationId: searchEventByName
      tags:
        - V2 API Search
      parameters:
        - in: path
          name: eventName
          description: The name of the event to search for.
          schema:
            type: string
          required: true
          example: fifa_world_cup_2022-12-18_argentina_vs_france
      responses:
        '200':
          description: Event details matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSearchResponse'
              example:
                search:
                - idEvent: '1666948'
                  strEvent: Argentina vs France
                  strFilename: FIFA World Cup 2022-12-18 Argentina vs France
                  idLeague: '4429'
                  strLeague: FIFA World Cup
                  dateEvent: '2022-12-18'
                  strThumb: https://r2.thesportsdb.com/images/media/event/thumb/ttb9go1671095858.jpg
                  strSport: Soccer
  /search/venue/{venueName}:
    get:
      summary: Search sports venue
      description: Search for any sports venue using a text string.
      operationId: searchVenueByName
      tags:
        - V2 API Search
      parameters:
        - in: path
          name: venueName
          description: The name of the venue to search for.
          schema:
            type: string
          required: true
          example: wembley
      responses:
        '200':
          description: Venue details matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueSearchResponse'
              example:
                search:
                - idVenue: '19835'
                  strVenue: Wembley Arena
                  strLocation: London, United Kingdom
                  strCountry: United Kingdom
                  strThumb: https://www.thesportsdb.com/images/media/venue/thumb/0cn2ky1719762176.jpg
                  strSport: Multi Sports
                - idVenue: '23604'
                  strVenue: Wembley Centre of Excellence
                  strLocation: Hayes, Clarendon, Jamaica
                  strCountry: Jamaica
                  strThumb: null
                  strSport: Soccer
                - idVenue: '16163'
                  strVenue: Wembley Stadium
                  strLocation: Wembley, London
                  strCountry: England
                  strThumb: https://www.thesportsdb.com/images/media/venue/thumb/qttuty1420627847.jpg
                  strSport: Soccer


# V2 API Lookup Endpoints
  /lookup/league/{idLeague}:
