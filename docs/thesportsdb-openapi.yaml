                  strSport: Soccer
                  strFormat: TeamvsTeam
                  strSportThumb: 'https://www.thesportsdb.com/images/sports/soccer.jpg'
                  strSportThumbBW: 'https://www.thesportsdb.com/images/sports/bw/soccer.jpg'
                  strSportIconGreen: 'https://www.thesportsdb.com/images/icons/sports/soccer.png'
                  strSportDescription: "Association football, more commonly known as football or soccer, is a team sport played between two teams of eleven players with a spherical ball. It is played by 250 million players in over 200 countries and dependencies, making it the world's most popular sport. The game is played on a rectangular field with a goal at each end. The object of the game is to score by getting the ball into the opposing goal.\r\n\r\nPlayers are not allowed to touch the ball with their hands or arms while it is in play, unless they are goalkeepers (and then only when within their penalty area). Other players mainly use their feet to strike or pass the ball, but may also use any part of their body except the hands and the arms. The team that scores the most goals by the end of the match wins. If the score is level at the end of the game, either a draw is declared or the game goes into extra time or a penalty shootout depending on the format of the competition. The Laws of the Game were originally codified in England by The Football Association in 1863. Association football is governed internationally by the International Federation of Association Football (FIFA; French: FÃ©dÃ©ration Internationale de Football Association), which organises World Cups for both men and women every four years."
                - idSport: '103'
                  strSport: Motorsport
                  strFormat: EventSport
                  strSportThumb: 'https://www.thesportsdb.com/images/sports/motorsport.jpg'
                  strSportThumbBW: 'https://www.thesportsdb.com/images/sports/bw/motorsport.jpg'
                  strSportIconGreen: 'https://www.thesportsdb.com/images/icons/sports/motorsport.png'
                  strSportDescription: "Motorsport or motor sport is a global term used to encompass the group of competitive sporting events which primarily involve the use of motorised vehicles, whether for racing or non-racing competition. The terminology can also be used to describe forms of competition of two-wheeled motorised vehicles under the banner of motorcycle racing, and includes off-road racing such as motocross.\r\n\r\nFour- (or more) wheeled motorsport competition is globally governed by the FÃ©dÃ©ration Internationale de l'Automobile (FIA); and the FÃ©dÃ©ration Internationale de Motocyclisme (FIM) governs two-wheeled competition."
                - idSport: '104'
                  strSport: Fighting
                  strFormat: EventSport
                  strSportThumb: 'https://www.thesportsdb.com/images/sports/fighting.jpg'
                  strSportThumbBW: 'https://www.thesportsdb.com/images/sports/bw/fighting.jpg'
                  strSportIconGreen: 'https://www.thesportsdb.com/images/icons/sports/fighting.png'
                  strSportDescription: "Combat (French for fight) is a purposeful violent conflict meant to weaken, establish dominance over, or kill the opposition, or to drive the opposition away from a location where it is not wanted or needed.\r\n\r\nCombat is typically between opposing military forces in warfare. Combat violence can be unilateral, whereas fighting implies at least a defensive reaction. A large-scale fight is known as a battle. A verbal fight is commonly known as an argument. Combat effectiveness, in the strategic field, requires combat readiness. In military areas, the term is applied also to personnel, that has to receive proper training and be qualified to carry out combat operations in the unit to which they are assigned."
                - idSport: '105'
                  strSport: Baseball
                  strFormat: TeamvsTeam
                  strSportThumb: 'https://www.thesportsdb.com/images/sports/baseball.jpg'
                  strSportThumbBW: 'https://www.thesportsdb.com/images/sports/bw/baseball.jpg'
                  strSportIconGreen: 'https://www.thesportsdb.com/images/icons/sports/baseball.png'
                  strSportDescription: "Baseball is a bat-and-ball game played between two teams of nine players each who take turns batting and fielding. The batting team attempts to score runs by hitting a ball (that is thrown by the opposing team's pitcher) with a bat swung by the batter, and then running counter-clockwise around a series of four bases: first, second, third, and home plate. A run is scored when a player advances around the bases and touches home plate.\r\n\r\nPlayers on the batting team take turns hitting against the pitcher of the fielding team, which tries to prevent runs by getting hitters out in any of several ways. A player on the batting team who reaches a base safely can later attempt to advance to subsequent bases during teammates' turns batting, such as on a hit or by other means. The teams switch between batting and fielding whenever the fielding team records three outs. One turn batting for both teams, beginning with the visiting team, constitutes an inning. A game is composed of nine innings, and the team with the greater number of runs at the end of the game wins. If scores are tied at the end of nine innings, extra innings are usually played. Baseball has no game clock, although most games end in the ninth inning.\r\n\r\nBaseball evolved from older bat-and-ball games already being played in England by the mid-18th century. This game was brought by immigrants to North America, where the modern version developed. By the late 19th century, baseball was widely recognized as the national sport of the United States. Baseball is currently popular in North America and parts of Central and South America, the Caribbean, and East Asia, particularly in Japan, South Korea, and Taiwan."
                - idSport: '106'
                  strSport: Basketball
                  strFormat: TeamvsTeam
                  strSportThumb: 'https://www.thesportsdb.com/images/sports/basketball.jpg'
                  strSportThumbBW: 'https://www.thesportsdb.com/images/sports/bw/basketball.jpg'
                  strSportIconGreen: 'https://www.thesportsdb.com/images/icons/sports/basketball.png'
                  strSportDescription: "Basketball is a limited-contact sport played on a rectangular court. While most often played as a team sport with five players on each side, three-on-three, two-on-two, and one-on-one competitions are also common. The objective is to shoot a ball through a hoop 18 inches (46 cm) in diameter and 10 feet (3.048 m) high that is mounted to a backboard at each end of the court. The game was invented in 1891 by Dr. James Naismith.\r\n\r\nA team can score a field goal by shooting the ball through the basket being defended by the opposition team during regular play. A field goal scores three points for the shooting team if the player shoots from behind the three-point line, and two points if shot from in front of the line. A team can also score via free throws, which are worth one point, after the other team is assessed with certain fouls. The team with the most points at the end of the game wins, but additional time (overtime) is mandated when the score is tied at the end of regulation. The ball can be advanced on the court by passing it to a teammate, or by bouncing it while walking or running (dribbling). It is a violation to lift, or drag, one's pivot foot without dribbling the ball, to carry it, or to hold the ball with both hands then resume dribbling.\r\n\r\nThe game has many individual techniques for displaying skillâ€”ball-handling, shooting, passing, dribbling, dunking, shot-blocking, and rebounding. Basketball teams generally have player positions, the tallest and strongest members of a team are called a center or power forward, while slightly shorter and more agile players are called small forward, and the shortest players or those who possess the best ball handling skills are called a point guard or shooting guard. The point guard directs the on court action of the team, implementing the coach's game plan, and managing the execution of offensive and defensive plays (player positioning).\r\n\r\nBasketball is one of the world's most popular and widely viewed sports.[1] The National Basketball Association (NBA) is the most significant professional basketball league in the world in terms of popularity, salaries, talent, and level of competition.[2][3] Outside North America, the top clubs from national leagues qualify to continental championships such as the Euroleague and FIBA Americas League. The FIBA Basketball World Cup and Men's Olympic Basketball Tournament are the major international events of the sport and attract top national teams from around the world. Each continent hosts regional competitions for national teams, like EuroBasket and FIBA AmeriCup.\r\n\r\nThe FIBA Women's Basketball World Cup and Women's Olympic Basketball Tournament feature top national teams from continental championships. The main North American league is the WNBA (NCAA Women's Division I Basketball Championship is also popular), whereas strongest European clubs participate in the EuroLeague Women."
                - idSport: '107'
                  strSport: American Football
                  strFormat: TeamvsTeam
                  strSportThumb: 'https://www.thesportsdb.com/images/sports/american_football.jpg'
                  strSportThumbBW: 'https://www.thesportsdb.com/images/sports/bw/american_football.jpg'
                  strSportIconGreen: 'https://www.thesportsdb.com/images/icons/sports/americanfootball.png'
                  strSportDescription: "American football, referred to as football in the United States and Canada, and also known as gridiron football or simply gridiron, is a team sport played by two teams of eleven players on a rectangular field with goalposts at each end. The offense, which is the team controlling the oval-shaped football, attempts to advance down the field by running with or passing the ball, while the defense, which is the team without control of the ball, aims to stop the offense's advance and aims to take control of the ball for themselves. The offense must advance at least ten yards in four downs, or plays, and otherwise they turn over the football to the defense; if the offense succeeds in advancing ten yards or more, they are given a new set of four downs. Points are primarily scored by advancing the ball into the opposing team's end zone for a touchdown or kicking the ball through the opponent's goalposts for a field goal. The team with the most points at the end of a game wins.\r\n\r\nAmerican football evolved in the United States, originating from the sports of association football and rugby football. The first game of American football was played on November 6, 1869, between two college teams, Rutgers and Princeton, under rules based on the association football rules of the time. During the latter half of the 1870s, colleges playing association football switched to the Rugby Union code, which allowed carrying the ball. A set of rule changes drawn up from 1880 onward by Walter Camp, the \"Father of American Football\", established the snap, eleven-player teams, and the concept of downs; later rule changes legalized the forward pass, created the neutral zone, and specified the size and shape of the football.\r\n\r\nAmerican football as a whole is the most popular sport in the United States. The most popular forms of the game are professional and college football, with the other major levels being high school and youth football. As of 2012, nearly 1.1 million high school athletes and 70,000 college athletes play the sport in the United States annually, almost all of them men, with a few exceptions. The National Football League, the most popular American football league, has the highest average attendance of any professional sports league in the world; its championship game, the Super Bowl, ranks among the most-watched club sporting events in the world, and the league has an annual revenue of around US$10 billion."

